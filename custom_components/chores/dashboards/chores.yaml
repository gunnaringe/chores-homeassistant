title: Chores
views:
  - title: Today
    cards:
      - type: heading
        heading: Today's Chores
        heading_level: 2

      - type: vertical-stack
        cards:
          - type: todo-list
            entity: todo.lisa
            title: Lisa's Chores
          - type: todo-list
            entity: todo.emma
            title: Emma's Chores
          - type: todo-list
            entity: todo.magnus
            title: Magnus's Chores

  - title: Balances
    cards:
      - type: heading
        heading: Allowance & Earnings
        heading_level: 2

      - type: markdown
        content: |
          These cards will appear once the Chores integration adds balance sensors.
          For now, view balances in the Chores web app.

      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.chores_lisa_balance
            title: Lisa's Balance
          - type: entity
            entity: sensor.chores_emma_balance
            title: Emma's Balance
          - type: entity
            entity: sensor.chores_magnus_balance
            title: Magnus's Balance

  - title: History
    cards:
      - type: heading
        heading: Past Chores & Payouts
        heading_level: 2

      - type: markdown
        content: |
          Once the Chores integration adds monthly earnings sensors and payout services,
          you can build charts and payout cards here.

          Example future automation:
          ```yaml
          automation:
            - alias: Notify on chore completion
              trigger:
                platform: event
                event_type: chores_task_completed
              action:
                - service: notify.mobile_app_phone
                  data:
                    message: "{{ trigger.event.data.child_name }} completed {{ trigger.event.data.task_title }}"
          ```
